services:
  db:
    build: ./db
    image: wordsmith-db:small
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  words:
    build: ./words
    image: wordsmith-words:small
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    image: wordsmith-web:small
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web/static:/app/static:ro
    depends_on:
      - words