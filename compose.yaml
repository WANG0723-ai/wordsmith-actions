services:
  db:
    image: yuzaki0723/wordsmith:db
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  words:
    image: yuzaki0723/wordsmith:words
    depends_on:
      db:
        condition: service_healthy

  web:
    image: yuzaki0723/wordsmith:web
    ports:
      - "${WEB_PORT:-8084}:80"
    depends_on:
      - words
